name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-disabled: true
      - name: Install Android 34
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          test -n "$SDKMANAGER"
          echo "Using SDK manager: $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platforms;android-34" "build-tools;34.0.0"
      - name: Bundle offline food photography
        run: |
          mkdir -p app/src/main/assets/img
          curl -fLsS --max-time 20 --retry 1 "https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=460&h=260&fit=crop&q=65" -o "app/src/main/assets/img/feast.jpg" || echo "Image feast unavailable; fallback will be used"
          curl -fLsS --max-time 20 --retry 1 "https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?w=460&h=260&fit=crop&q=65" -o "app/src/main/assets/img/baking.jpg" || echo "Image baking unavailable; fallback will be used"
          curl -fLsS --max-time 20 --retry 1 "https://images.unsplash.com/photo-1488477181946-6428a0291777?w=460&h=260&fit=crop&q=65" -o "app/src/main/assets/img/dessert.jpg" || echo "Image dessert unavailable; fallback will be used"
          curl -fLsS --max-time 20 --retry 1 "https://images.unsplash.com/photo-1547592180-85f173990554?w=460&h=260&fit=crop&q=65" -o "app/src/main/assets/img/soup.jpg" || echo "Image soup unavailable; fallback will be used"
          curl -fLsS --max-time 20 --retry 1 "https://images.unsplash.com/photo-1544025162-d76694265947?w=460&h=260&fit=crop&q=65" -o "app/src/main/assets/img/meat.jpg" || echo "Image meat unavailable; fallback will be used"
          curl -fLsS --max-time 20 --retry 1 "https://images.unsplash.com/photo-1519708227418-c8fd9a32b7a2?w=460&h=260&fit=crop&q=65" -o "app/src/main/assets/img/fish.jpg" || echo "Image fish unavailable; fallback will be used"
          curl -fLsS --max-time 20 --retry 1 "https://images.unsplash.com/photo-1512621776951-a57141f2eefd?w=460&h=260&fit=crop&q=65" -o "app/src/main/assets/img/salad.jpg" || echo "Image salad unavailable; fallback will be used"
          curl -fLsS --max-time 20 --retry 1 "https://images.unsplash.com/photo-1513558161293-cdaf765edfd7?w=460&h=260&fit=crop&q=65" -o "app/src/main/assets/img/drinks.jpg" || echo "Image drinks unavailable; fallback will be used"
          curl -fLsS --max-time 20 --retry 1 "https://images.unsplash.com/photo-1470337458703-46ad1756a187?w=460&h=260&fit=crop&q=65" -o "app/src/main/assets/img/spirits.jpg" || echo "Image spirits unavailable; fallback will be used"
          curl -fLsS --max-time 20 --retry 1 "https://images.unsplash.com/photo-1490645935967-10de6ba17061?w=460&h=260&fit=crop&q=65" -o "app/src/main/assets/img/preserve.jpg" || echo "Image preserve unavailable; fallback will be used"
      - name: Bundle featured dish photos
        run: |
          mkdir -p app/src/main/assets/img/dishes
          curl -fLsS --max-time 25 --retry 1 "https://images.unsplash.com/photo-1630684789391-d59419768fb1?w=700&h=460&fit=crop&q=68" -o "app/src/main/assets/img/dishes/525.jpg" || echo "Optional dish photo 525 unavailable"
          curl -fLsS --max-time 25 --retry 1 "https://images.unsplash.com/photo-1758714068469-75887ca0b8c3?w=700&h=460&fit=crop&q=68" -o "app/src/main/assets/img/dishes/526.jpg" || echo "Optional dish photo 526 unavailable"
          curl -fLsS --max-time 25 --retry 1 "https://images.unsplash.com/photo-1757124034578-2ec0f0843fcc?w=700&h=460&fit=crop&q=68" -o "app/src/main/assets/img/dishes/527.jpg" || echo "Optional dish photo 527 unavailable"
          curl -fLsS --max-time 25 --retry 1 "https://images.unsplash.com/photo-1709429790175-b02bb1b19207?w=700&h=460&fit=crop&q=68" -o "app/src/main/assets/img/dishes/531.jpg" || echo "Optional dish photo 531 unavailable"
          find app/src/main/assets/img/dishes -type f -name "*.jpg" -size -3k -delete
      - name: Validate offline recipes
        run: python3 tools/validate_catalog.py
      - name: Build compatible debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RezeptWorld-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
